name: Android APK

# Builds the AU-Getway phone app on GitHub's Linux machines (no Windows path-length limit)
# and attaches the APK to a GitHub Release.
#
# Run it by pushing a tag:   git tag apk-v2.29 && git push origin apk-v2.29
# or from the Actions tab:   Android APK > Run workflow (tag name is asked).
on:
  push:
    tags:
      - "apk-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example apk-v2.29"
        required: true

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile --filter @uniqpay/mobile...

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --console=plain

      - name: Publish the APK on a GitHub Release
        run: |
          VERSION="$(node -p "require('./apps/mobile/app.json').expo.version")"
          APK="AU-Getway-v${VERSION}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          NOTES="Android app for the AU-Getway pay desk (version ${VERSION}). Install it on the merchant phone and sign in with the desk email and password. It is signed with a debug key, so it is for your own phone and not for the Play Store."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --title "AU-Getway app ${VERSION}" --notes "$NOTES"
          fi
