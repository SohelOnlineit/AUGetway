# aaPanel site config for the API address of a website: api.au.uniqbd.com and api.au.amarpin.com.
# Make one aaPanel site per api. address and paste this INSIDE the existing server { } block.
# Keep listen, server_name, and ssl_certificate from the panel.
# Delete default location / and PHP blocks. The API stays on 127.0.0.1:4100.
# Do not proxy to 4000. That port is AmarPin.
#
# A shop that calls https://api.au.amarpin.com/api/checkout-v2 gets payment links on https://au.amarpin.com,
# because the API reads the Host header and treats api.au.amarpin.com as au.amarpin.com.
# Host $host matters. Never change it to a fixed name.

# The API accepts at most 3 MB (pictures inside JSON), so nginx refuses anything bigger first.
client_max_body_size 4m;
server_tokens off;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Send only the address nginx saw. The API counts rate limits per visitor and trusts exactly this one hop,
    # so an X-Forwarded-For header made up by the visitor must never be passed along.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
