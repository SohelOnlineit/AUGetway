# aaPanel site config for api.pay.uniqbd.com — paste INSIDE the existing server { } block.
# Keep listen, server_name, and ssl_certificate from the panel.
# Delete default location / and PHP blocks. The API stays on 127.0.0.1:4100.
# Do not proxy to 4000. That port is AmarPin.

client_max_body_size 8m;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
