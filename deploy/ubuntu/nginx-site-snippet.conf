# aaPanel site config for a WEBSITE address of AU-Getway: pay.uniqbd.com and pay.amarpin.com.
# Make one aaPanel site per address and paste this INSIDE each existing server { } block.
# The panel owns listen, server_name, and ssl_certificate lines. Do not replace them.
# Delete the panel's default "location /" (root + index + php) and use this instead.
# /api is forwarded on the same address, so the website, the phone app and a shop can all use
# https://pay.amarpin.com/api (the api.pay.amarpin.com address, see nginx-api-snippet.conf, is the same API).
# Do not proxy to 3000 or 4000. Those ports are AmarPin.
#
# Host $host matters: the API reads it to know which address the visitor came in on, and shows the name, logo and
# payment links of that address. Never change it to a fixed name.
# (X-Forwarded-Host from a visitor is ignored by the API on the live site, so it need not be overwritten.)

# The API accepts at most 3 MB (pictures inside JSON), so nginx refuses anything bigger first.
client_max_body_size 4m;
server_tokens off;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

# X-Forwarded-For below carries only the address nginx saw. The API counts rate limits per visitor and trusts
# exactly this one hop, so an X-Forwarded-For header made up by the visitor must never be passed along.
location /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
