# aaPanel site config for pay.uniqbd.com — paste INSIDE the existing server { } block.
# The panel owns listen, server_name, and ssl_certificate lines. Do not replace them.
# Delete the panel's default "location /" (root + index + php) and use this instead.
# REST API and live chat use api.uniqbd.com (see nginx-api-snippet.conf).

client_max_body_size 20m;

add_header X-Content-Type-Options nosniff always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

# Next.js storefront. The API is on api.uniqbd.com.
location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
